name: Daily real production intelligence
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: truestate-production-intelligence
  cancel-in-progress: false
jobs:
  refresh:
    # Operator enables only after the first verified real release is installed.
    if: github.repository == 'huddartanay/truestate-analytics' && github.ref == 'refs/heads/main' && vars.TRUESTATE_INTELLIGENCE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned ingestion dependencies
        run: python -m pip install --require-hashes -r deploy/requirements-intelligence.lock
      - name: Restore verified history, refresh registered RSS, validate and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m intelligence.production.release_job scheduled
